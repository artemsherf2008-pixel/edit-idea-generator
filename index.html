<section class="card presets-card">
  <p class="label">Быстрый старт</p>

  <h2 class="presets-title">Выбери формат</h2>

  <p class="presets-subtitle">
    Готовые настройки для самых популярных типов монтажа
  </p>

  <div class="presets">

    <button
      type="button"
      class="preset-card preset-btn"
      data-format="shorts"
      data-duration="30"
    >
      <span class="preset-icon">⚡</span>

      <span class="preset-content">
        <strong>Reels / Shorts</strong>
        <small>Динамичный вертикальный ролик</small>
      </span>

      <span class="preset-time">30 сек</span>
    </button>


    <button
      type="button"
      class="preset-card preset-btn"
      data-format="shorts"
      data-duration="60"
    >
      <span class="preset-icon">🔥</span>

      <span class="preset-content">
        <strong>Reels / Shorts</strong>
        <small>Расширенный вертикальный ролик</small>
      </span>

      <span class="preset-time">60 сек</span>
    </button>


    <button
      type="button"
      class="preset-card preset-btn"
      data-format="youtube"
      data-duration="60"
    >
      <span class="preset-icon">▶</span>

      <span class="preset-content">
        <strong>YouTube</strong>
        <small>Горизонтальный ролик</small>
      </span>

      <span class="preset-time">60 сек</span>
    </button>


    <button
      type="button"
      class="preset-card preset-btn"
      data-format="music"
      data-duration="30"
    >
      <span class="preset-icon">♫</span>

      <span class="preset-content">
        <strong>Music Edit</strong>
        <small>Монтаж под музыку и бит</small>
      </span>

      <span class="preset-time">30 сек</span>
    </button>

  </div>
</section>
