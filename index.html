<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Planner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <p class="eyebrow">для видеомонтажа</p>
        <h1>Edit Planner</h1>
        <p class="subtitle">
          Укажи формат, тему и длительность — получи пошаговый план монтажа.
        </p>
      </header>

      <section id="projects" class="card">
        <p class="label">Мои проекты</p>
        <p id="projects-empty" class="meta">Пока нет сохранённых проектов.</p>
        <ul id="projects-list" class="project-list"></ul>
      </section>

      <section class="card presets-card">
        <p class="label">Быстрые пресеты</p>
        <div class="actions presets">
          <button
            type="button"
            class="secondary preset-btn"
            data-format="shorts"
            data-duration="30"
          >
            Reels / Shorts — 30 сек
          </button>
          <button
            type="button"
            class="secondary preset-btn"
            data-format="shorts"
            data-duration="60"
          >
            Reels / Shorts — 60 сек
          </button>
          <button
            type="button"
            class="secondary preset-btn"
            data-format="youtube"
            data-duration="60"
          >
            YouTube — 60 сек
          </button>
          <button
            type="button"
            class="secondary preset-btn"
            data-format="music"
            data-duration="30"
          >
            Музыкальный edit — 30 сек
          </button>
        </div>
      </section>

      <form id="planner-form" class="card form-card">
        <label>
          Формат видео
          <select id="format" name="format" required>
            <option value="shorts">Вертикальный ролик (Shorts / Reels / TikTok)</option>
            <option value="youtube">Горизонтальный ролик (YouTube)</option>
            <option value="music">Музыкальный эдит</option>
            <option value="teaser">Тизер / трейлер</option>
          </select>
        </label>

        <label>
          Тема
          <input
            id="theme"
            name="theme"
            type="text"
            placeholder="Например: утренняя рутина"
            required
            maxlength="80"
          />
        </label>

        <label>
          Длительность (секунды)
          <input
            id="duration"
            name="duration"
            type="number"
            min="8"
            max="600"
            value="30"
            required
          />
        </label>

        <button id="generate-btn" type="submit">Составить план</button>
      </form>

      <section id="result" class="card result-card" hidden aria-live="polite">
        <p class="label">План монтажа</p>
        <h2 id="plan-title"></h2>
        <p id="plan-meta" class="meta"></p>
        <ol id="plan-steps"></ol>
        <textarea id="plan-editor" hidden></textarea>
        <div id="plan-actions" class="actions">
          <button id="reroll-btn" type="button" class="secondary">
            Новый план
          </button>
          <button id="copy-btn" type="button" class="secondary">
            Скопировать план
          </button>
          <button id="export-btn" type="button" class="secondary">
            Экспортировать
          </button>
          <button id="edit-btn" type="button" class="secondary">
            Редактировать
          </button>
          <button id="save-btn" type="button" class="secondary">
            Сохранить проект
          </button>
        </div>
        <div id="edit-actions" class="actions" hidden>
          <button id="save-edits-btn" type="button">
            Сохранить изменения
          </button>
          <button id="cancel-edits-btn" type="button" class="secondary">
            Отмена
          </button>
        </div>

        <div class="checklist">
          <p class="label">Чек-лист монтажа</p>
          <p id="checklist-progress" class="meta">0 из 6 готово · 0%</p>
          <div class="checklist-bar" aria-hidden="true">
            <span id="checklist-bar"></span>
          </div>
          <ul class="check-list">
            <li>
              <label class="check-item">
                <input type="checkbox" data-check="sources" />
                Отсортировал исходники
              </label>
            </li>
            <li>
              <label class="check-item">
                <input type="checkbox" data-check="rough" />
                Собрал черновой монтаж
              </label>
            </li>
            <li>
              <label class="check-item">
                <input type="checkbox" data-check="sound" />
                Настроил звук
              </label>
            </li>
            <li>
              <label class="check-item">
                <input type="checkbox" data-check="text" />
                Добавил текст/субтитры
              </label>
            </li>
            <li>
              <label class="check-item">
                <input type="checkbox" data-check="color" />
                Проверил цвет
              </label>
            </li>
            <li>
              <label class="check-item">
                <input type="checkbox" data-check="review" />
                Проверил ролик перед экспортом
              </label>
            </li>
          </ul>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
